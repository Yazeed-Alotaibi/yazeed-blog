<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading not found — yazeed.blog</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;

      --ground:      #d9d7cf;
      --sheet:       #f3f2ed;
      --sheet-sunk:  #e6e4db;
      --ink:         #15181a;
      --ink-2:       #43474a;
      --ink-3:       #585c5e;
      --rule:        #c6c4b9;
      --rule-2:      #87867d;
      --accent:      #3b3690;
      --accent-soft: #e2e1f1;
      --good:        #1f6b4f;
      --good-soft:   #dfe9e4;
      --warn:        #7d5703;
      --warn-soft:   #f2ecdd;
      --bad:         #a32c22;
      --bad-soft:    #f2e0dd;
      --strip:       #1b1e22;
      --strip-ink:   #d7dbd2;
      --strip-grid:  rgba(215, 219, 210, 0.09);
      --shadow:      0 1px 0 rgba(0,0,0,.07), 0 14px 30px -24px rgba(0,0,0,.5);
      --lip:         inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(0,0,0,.05);
      --sunk:        inset 0 2px 4px rgba(0,0,0,.10), inset 0 -1px 0 rgba(255,255,255,.6);
      --display:     "Big Shoulders Display", "Haettenschweiler", Impact, sans-serif;
      --body:        "Libre Franklin", system-ui, -apple-system, sans-serif;
      --mono:        "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
      --text-base:   clamp(0.95rem, 0.9rem + 0.2vw, 1.02rem);
      --dur:         180ms;
      --ease:        cubic-bezier(0.2, 0.7, 0.3, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --ground:      #131518;
        --sheet:       #1d2126;
        --sheet-sunk:  #171a1e;
        --ink:         #eceae2;
        --ink-2:       #9aa0a5;
        --ink-3:       #8a9095;
        --rule:        #2f353b;
        --rule-2:      #6a7075;
        --accent:      #9d97ff;
        --accent-soft: #24234a;
        --good:        #52c295;
        --good-soft:   #16302a;
        --warn:        #d9a83f;
        --warn-soft:   #322a16;
        --bad:         #ef8177;
        --bad-soft:    #3a1f1d;
        --strip:       #0e1012;
        --strip-ink:   #c9cec4;
        --strip-grid:  rgba(201, 206, 196, 0.07);
        --shadow:      0 1px 0 rgba(0,0,0,.5), 0 14px 30px -24px rgba(0,0,0,.9);
        --lip:         inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.4);
        --sunk:        inset 0 2px 5px rgba(0,0,0,.5);
      }
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      width: 100%;
      max-width: 100vw;
      min-width: 0;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3.5rem);
      background: var(--ground);
      color: var(--ink);
      font-family: var(--body);
      font-size: var(--text-base);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    :where(a):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .panel {
      width: 100%;
      max-width: 700px;
      min-width: 0;
      overflow: hidden;
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-radius: 4px;
      box-shadow: var(--shadow), var(--lip);
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem 1.1rem;
      background: var(--sheet-sunk);
      border-bottom: 1px solid var(--rule);
    }

    .brand,
    .status,
    .dial-label,
    .dial-value,
    .actions a,
    .foot {
      font-family: var(--mono);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      min-height: 44px;
      color: inherit;
      font-size: .72rem;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 2rem;
      height: 2rem;
      place-items: center;
      background: var(--accent);
      color: var(--sheet);
      border-radius: 3px;
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
    }

    .status {
      color: var(--bad);
      font-size: .66rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .copy {
      padding: clamp(1.5rem, 5vw, 2.75rem) clamp(1.1rem, 6vw, 3.5rem) 1rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(2.8rem, 10vw, 5.6rem);
      font-weight: 700;
      letter-spacing: .015em;
      line-height: .9;
      overflow-wrap: anywhere;
      text-transform: uppercase;
    }

    .lede {
      max-width: 38rem;
      margin: 1rem auto 0;
      color: var(--ink-2);
    }

    .instrument {
      margin: 0 clamp(1.1rem, 6vw, 3.5rem);
      padding: .7rem .7rem 1rem;
      background: var(--sheet-sunk);
      border: 1px solid var(--rule);
      border-radius: 3px;
      box-shadow: var(--sunk);
    }

    .instrument svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .dial-arc {
      fill: none;
      stroke: var(--rule-2);
      stroke-width: 8;
    }

    .dial-inner {
      fill: var(--sheet);
      stroke: var(--rule);
      stroke-width: 1;
    }

    .dial-tick {
      stroke: var(--ink-3);
      stroke-width: 2;
    }

    .dial-tick.major {
      stroke: var(--ink);
      stroke-width: 3;
    }

    .dial-needle {
      stroke: var(--ink);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .dial-hub { fill: var(--ink); }

    .dial-label {
      fill: var(--ink-3);
      font-size: 10px;
      letter-spacing: .08em;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .dial-value {
      fill: var(--ink);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-anchor: middle;
    }

    figcaption {
      margin-top: -.1rem;
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: .63rem;
      letter-spacing: .13em;
      text-align: center;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .7rem;
      padding: 1.5rem clamp(1.1rem, 6vw, 3.5rem) .4rem;
    }

    .actions a {
      display: inline-grid;
      min-width: 9rem;
      min-height: 44px;
      place-items: center;
      padding: .55rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 3px;
      color: var(--accent);
      font-size: .68rem;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }

    .actions a:hover {
      background: var(--accent);
      color: var(--sheet);
    }

    .foot {
      margin: 0;
      padding: 1rem 1.1rem 1.25rem;
      color: var(--ink-3);
      font-size: .62rem;
      letter-spacing: .1em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }

    @media (max-width: 520px) {
      .panel { max-width: calc(100vw - 2rem); }
      .head { align-items: flex-start; flex-direction: column; gap: .55rem; }
      .status { padding-left: 2.6rem; }
      .actions { flex-direction: column; }
      .actions a { width: 100%; }
    }
  </style>
</head>
<body>

    <header class="head">

        <span>Calculation Desk</span>
      </a>
      <span class="status">Bench status · 404</span>
    </header>

    <section class="copy">

      <p class="lede">This address is not on the bench; return to the desk or browse its instruments.</p>

    <figure class="instrument">

        <circle class="dial-hub" cx="160" cy="160" r="7" />

    <nav class="actions" aria-label="Not found navigation">

  </main>
</body>
</html>
